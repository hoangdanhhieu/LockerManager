{% extends 'accounts/base.html' %}
{% block title %}Dashboard - FaceID Locker{% endblock %}

{% block page_title %}Usage History{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage History - FaceID Locker Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar {
            transition: all 0.3s ease;
        }
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 10px;
            background-color: #ef4444;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <!-- Content -->
            <main class="p-6">

                <!-- Filters -->
                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <h3 class="text-lg font-semibold mb-4">Search</h3>
                    <form id="filter-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                        <label class="block text-gray-700 text-sm font-medium mb-2" >Từ ngày</label>
                        <input type="date" id="startDate" name="startDate"  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>           
                        <label class="block text-gray-700 text-sm font-medium mb-2">Đến ngày</label>
                        <input type="date" id="endDate" name="endDate"  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-medium mb-2">Board</label>
                            <select id="boardFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="all">All Board</option>
                                {% for i in range32 %}
                                <option value="{{i}}">Board #{{i}}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-medium mb-2">Locker</label>
                            <select id="lockerFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="all">All Lockers</option>
                                {% for i in range16 %}
                                <option value="{{i}}">Locker #{{i}}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-medium mb-2">User</label>
                            <input type="text" id="userFilter" placeholder="Name or SDT" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div class="flex items-end">
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg">
                                Search
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Usage History Table -->
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold">Access History</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date/Time</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Board</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Locker</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200" id="historyTableBody">
                            </tbody>
                        </table>
                    </div>
                    
                
                    <!-- Pagination 
                    <div class="flex items-center justify-between mt-6">
                        <div class="text-sm text-gray-700">
                            Showing <span class="font-medium">1</span> to <span class="font-medium">5</span> of <span class="font-medium">247</span> results
                        </div>
                        <div class="flex space-x-2">
                            <button class="px-3 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50" disabled>
                                Previous
                            </button>
                            <button class="px-3 py-2 bg-indigo-600 text-white rounded-lg">1</button>
                            <button class="px-3 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">2</button>
                            <button class="px-3 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">3</button>
                            <button class="px-3 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                                Next
                            </button>
                        </div>
                    </div>
                -->
                <div id="pagination" class="flex items-center justify-between mt-6">
                    <div class="text-sm text-gray-1000">
                        <span id="current-page" class="font-medium">1</span> / <span id="total-pages" class="font-medium">1</span>
                    </div>
                    <div class="flex space-x-2">
                        <button id="prev-page" class="px-3 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50">Previous</button>
                        <button id="next-page" class="px-3 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">Next</button>
                    </div>
                </div>

                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let currentPage = 1;
            const perPage = 10;

            function loadUsageHistory(page = 1) {
                let user_id = document.getElementById('userFilter').value;
                let board_id = document.getElementById('boardFilter').value;
                let locker_id = document.getElementById('lockerFilter').value;
                let startDate = document.getElementById('startDate').value;
                let endDate = document.getElementById('endDate').value;

                let params = new URLSearchParams({
                    page: page,
                    per_page: perPage
                });

                if(user_id) params.append('user_id', user_id);
                if(board_id) params.append('board_id', board_id);
                if(locker_id) params.append('locker_id', locker_id);
                if(startDate) params.append('start_date', startDate);
                if(endDate) params.append('end_date', endDate);

                fetch(`/api/usage_history/?${params.toString()}`)
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.success) {
                            let tbody = '';
                            data.logs.forEach(log => {
                                tbody += `
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${log.date_time}</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center">
                                            <div class="ml-4">
                                                <div class="text-sm font-medium text-gray-900">${log.user}</div>
                                                <div class="text-sm text-gray-500">${log.sdt}</div>
                                            </div>
                                        </div>
                                    </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${log.board}</td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${log.locker}</td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span class="${log.action === 'Access' ? 'bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full' : 'bg-red-100 text-red-800 text-xs px-2 py-1 rounded-full'}">${log.action}</span>
                                    </td>
                                </tr>`;
                            });
                            document.querySelector("#historyTableBody").innerHTML = tbody;
                            document.getElementById('current-page').textContent = data.current_page;
                            document.getElementById('total-pages').textContent = data.num_pages;
                            currentPage = data.current_page;
                        }
                    });
            }
        
            // Filter submit
            document.getElementById('filter-form').addEventListener('submit', function(e){
                e.preventDefault();
                loadUsageHistory(1);
            });
        
            // Pagination buttons
            document.getElementById('prev-page').addEventListener('click', function(){
                if(currentPage > 1) loadUsageHistory(currentPage - 1);
            });
            document.getElementById('next-page').addEventListener('click', function() {
                const total = parseInt(document.getElementById('total-pages').textContent);
                if(currentPage < total) loadUsageHistory(currentPage + 1);
            });
        
            loadUsageHistory();
        });


    </script>
</body>
</html>
{% endblock %}
